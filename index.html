<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ravenswatch Randomizer: Random Character &amp; Modifier Picker</title>
    <meta
      name="description"
      content="Free Ravenswatch randomizer. Roll a random character for every player and random Custom Mode modifiers, see the score change, then share the run."
    />
    <link rel="canonical" href="https://ravenswatch-randomizer.com/" />

    <meta name="theme-color" content="#0f0f23" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ravenswatch Randomizer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ravenswatch-randomizer.com/" />
    <meta property="og:title" content="Ravenswatch Randomizer: Random Characters &amp; Modifiers" />
    <meta
      property="og:description"
      content="Let the ravens pick your next run: a random character for every player and random Custom Mode modifiers, ready to share with your party."
    />
    <meta property="og:image" content="https://ravenswatch-randomizer.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ravenswatch Randomizer logo over Ravenswatch hero portraits"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://ravenswatch-randomizer.com/#website",
            "name": "Ravenswatch Randomizer",
            "url": "https://ravenswatch-randomizer.com/",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://ravenswatch-randomizer.com/#app",
            "name": "Ravenswatch Randomizer",
            "url": "https://ravenswatch-randomizer.com/",
            "description": "Free Ravenswatch randomizer. Roll a random character for every player and random Custom Mode modifiers, see the score change, then share the run.",
            "image": "https://ravenswatch-randomizer.com/og-image.jpg",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "about": { "@type": "VideoGame", "name": "Ravenswatch" },
            "isPartOf": { "@id": "https://ravenswatch-randomizer.com/#website" }
          }
        ]
      }
    </script>

    <!-- Hides the prerendered default screen when there is state to restore -->
    <script>
      {
        let hasSavedState = false;

        try {
          hasSavedState = localStorage.length > 0;
        } catch {
          // Storage is blocked
        }

        if (location.search !== '' || hasSavedState) {
          document.documentElement.setAttribute('data-restoring', '');
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
